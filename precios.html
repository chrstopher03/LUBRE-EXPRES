<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escáner de Productos</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

h1,h2{
    text-align:center;
}

#reader{
    width:100%;
    max-width:700px;
    height:350px;
    margin:20px auto;
    border:3px solid #333;
    background:#000;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
    margin-top:20px;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

#detalle{
    display:none;
    max-width:600px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

#detalle img{
    width:300px;
    max-width:100%;
    object-fit:contain;
}

.precio{
    font-size:40px;
    color:green;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>Catálogo de Productos</h1>

<button onclick="iniciarCamara()">
📷 Iniciar Escáner
</button>

<div id="reader"></div>

<div id="detalle">
    <img id="imgProducto">
    <h2 id="nombreProducto"></h2>
    <div class="precio" id="precioProducto"></div>
    <p id="codigoProducto"></p>
</div>

<div class="grid" id="listaProductos"></div>

<script>

const productos = [

{
    codigo:"100001",
    nombre:"Mobil Parmazone",
    precio:"780",
    imagen:"6.jpeg"
},

{
    codigo:"100002",
    nombre:"Mobil Heavy Duty",
    precio:"780",
    imagen:"7.jpeg"
},

{
    codigo:"100003",
    nombre:"Mobil ATF D/M",
    precio:"350",
    imagen:"8.jpeg"
},


{
    codigo:"100004",
    nombre:"American Automatic transmission",
    precio:"180",
    imagen:"11.jpeg"
},

{
    codigo:"100005",
    nombre:"Mobil Delvac Extreme SAE 15W-40 API CK-4.",
    precio:"1700",
    imagen:"12.jpeg"
},

{
    codigo:"100006",
    nombre:"Mobil Delvac Extreme SAE 10W-30 API CK-4 ",
    precio:"2400",
    imagen:"60.jpeg"
}


];

const lista = document.getElementById("listaProductos");

productos.forEach((p,i)=>{

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
        <h3>${p.nombre}</h3>
        <svg id="barcode${i}"></svg>
        <p>${p.codigo}</p>
    `;

    lista.appendChild(card);

    JsBarcode(
        "#barcode"+i,
        p.codigo,
        {
            format:"CODE128",
            width:2,
            height:80,
            displayValue:false
        }
    );

});

function mostrarProducto(codigo){

    const producto = productos.find(
        p => p.codigo === codigo
    );

    if(!producto) return;

    document.getElementById("detalle").style.display="block";

    document.getElementById("imgProducto").src =
        producto.imagen;

    document.getElementById("nombreProducto").textContent =
        producto.nombre;

    document.getElementById("precioProducto").textContent =
        "C$ " + producto.precio;

    document.getElementById("codigoProducto").textContent =
        "Código: " + producto.codigo;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function iniciarCamara(){

    Quagga.init({

        inputStream:{
            type:"LiveStream",
            target:document.querySelector("#reader"),
            constraints:{
                facingMode:"environment"
            }
        },

        decoder:{
            readers:[
                "code_128_reader",
                "ean_reader",
                "ean_8_reader"
            ]
        }

    },function(err){

        if(err){
            alert("Error al iniciar la cámara");
            return;
        }

        Quagga.start();
    });

    Quagga.onDetected(function(data){

        const codigo =
            data.codeResult.code;

        mostrarProducto(codigo);

    });
}

</script>

</body>
</html>

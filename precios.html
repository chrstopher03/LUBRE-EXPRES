<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escáner de Productos</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.boton{
    display:block;
    margin:0 auto 20px;
    padding:14px 25px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.boton:hover{
    background:#1d4ed8;
}

#reader{
    width:100%;
    max-width:800px;
    height:350px;
    margin:0 auto;
    border-radius:12px;
    overflow:hidden;
    border:4px solid #222;
    background:#000;
}

.resultado{
    max-width:900px;
    margin:25px auto;
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
    display:none;
}

.resultado-contenido{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    align-items:center;
}

.resultado img{
    width:320px;
    max-width:100%;
    object-fit:contain;
}

.info{
    flex:1;
}

.nombre{
    font-size:30px;
    font-weight:bold;
    margin-bottom:15px;
}

.precio{
    font-size:50px;
    color:green;
    font-weight:bold;
}

.codigo{
    margin-top:10px;
    color:#666;
}

.catalogo{
    margin-top:40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card h3{
    margin-bottom:15px;
    min-height:60px;
}

svg{
    width:100%;
}

.estado{
    text-align:center;
    margin-top:10px;
    color:#555;
}

</style>
</head>
<body>

<h1>Consulta de Productos</h1>

<button class="boton" onclick="iniciarCamara()">
📷 Iniciar Cámara
</button>

<div id="reader"></div>

<div class="estado" id="estado">
Esperando inicio del escáner...
</div>

<div id="resultado" class="resultado">

    <div class="resultado-contenido">

        <img id="fotoProducto" src="">

        <div class="info">

            <div class="nombre" id="nombreProducto"></div>

            <div class="precio" id="precioProducto"></div>

            <div class="codigo" id="codigoProducto"></div>

        </div>

    </div>

</div>

<div class="catalogo">

<h2 style="text-align:center;margin-bottom:20px;">
Productos Disponibles
</h2>

<div class="grid" id="catalogo"></div>

</div>

<script>

const productos = [

{
    codigo:"100001",
    nombre:"Mobil Parmazone",
    precio:"780",
    imagen:"6.jpeg"
},

{
    codigo:"100002",
    nombre:"Mobil Heavy Duty",
    precio:"780",
    imagen:"7.jpeg"
},

{
    codigo:"100003",
    nombre:"Mobil ATF D/M",
    precio:"350",
    imagen:"8.jpeg"
},


{
    codigo:"100004",
    nombre:"American Automatic transmission",
    precio:"180",
    imagen:"11.jpeg"
},

{
    codigo:"100005",
    nombre:"Mobil Delvac Extreme SAE 15W-40 API CK-4.",
    precio:"1700",
    imagen:"12.jpeg"
},

{
    codigo:"100006",
    nombre:"Mobil Delvac Extreme SAE 10W-30 API CK-4 ",
    precio:"2400",
    imagen:"60.jpeg"
}

];

const catalogo = document.getElementById("catalogo");

productos.forEach((producto,index)=>{

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
        <h3>${producto.nombre}</h3>
        <svg id="barcode${index}"></svg>
        <p>${producto.codigo}</p>
    `;

    catalogo.appendChild(card);

    JsBarcode(
        `#barcode${index}`,
        producto.codigo,
        {
            format:"CODE128",
            width:2,
            height:80,
            displayValue:false
        }
    );

});

function mostrarProducto(codigo){

    const producto =
        productos.find(p => p.codigo === codigo);

    if(!producto) return;

    document.getElementById("resultado").style.display = "block";

    document.getElementById("fotoProducto").src =
        producto.imagen;

    document.getElementById("nombreProducto").textContent =
        producto.nombre;

    document.getElementById("precioProducto").textContent =
        "C$ " + producto.precio;

    document.getElementById("codigoProducto").textContent =
        "Código: " + producto.codigo;

    document.getElementById("resultado")
        .scrollIntoView({behavior:"smooth"});
}

let scannerActivo = false;

function iniciarCamara(){

    if(scannerActivo) return;

    scannerActivo = true;

    document.getElementById("estado").textContent =
        "Escáner activo. Apunte la cámara al código.";

    Quagga.init({

        inputStream:{
            type:"LiveStream",
            target:document.querySelector("#reader"),
            constraints:{
                facingMode:"environment"
            }
        },

        decoder:{
            readers:[
                "code_128_reader",
                "ean_reader",
                "ean_8_reader"
            ]
        }

    }, function(err){

        if(err){

            console.error(err);

            document.getElementById("estado").textContent =
                "Error al iniciar la cámara.";

            return;
        }

        Quagga.start();

    });

    Quagga.onDetected(function(data){

        const codigo = data.codeResult.code;

        mostrarProducto(codigo);

    });

}

</script>

</body>
</html>

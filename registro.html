<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro de Ventas - LUBRI EXPRES</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0b0b0b;
color:white;
padding:16px;
padding-bottom:120px;
overflow-x:hidden;
}

/* HEADER */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:10px;
}

.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo i{
font-size:24px;
color:#f7c600;
}

.logo h1{
font-size:26px;
color:#f7c600;
font-weight:800;
}

/* TARJETAS */

.stats{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));
gap:14px;
margin-bottom:20px;
}

.card{
background:#141414;
padding:18px;
border-radius:20px;
border:1px solid rgba(255,255,255,.05);
position:relative;
overflow:hidden;
}

.card::before{
content:'';
position:absolute;
top:0;
left:0;
width:100%;
height:4px;
background:#f7c600;
}

.card span{
font-size:13px;
color:#888;
display:block;
margin-bottom:8px;
}

.card h2{
font-size:26px;
font-weight:800;
}

/* FILTROS */

.filters{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:12px;
margin-bottom:20px;
}

.filters input,
.filters select,
.filters button{
width:100%;
padding:14px;
background:#141414;
border:none;
outline:none;
border-radius:14px;
color:white;
font-size:14px;
}

.filters button{
background:#f7c600;
color:black;
font-weight:700;
cursor:pointer;
transition:.3s;
}

.filters button:hover{
transform:translateY(-2px);
}

/* CORTE */

.corte{
background:#141414;
padding:18px;
border-radius:20px;
margin-bottom:20px;
border:1px solid rgba(255,255,255,.05);
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:14px;
}

.corte h2{
font-size:20px;
color:#f7c600;
}

.corte-box{
display:flex;
gap:25px;
flex-wrap:wrap;
}

.corte-item span{
font-size:13px;
color:#888;
display:block;
margin-bottom:5px;
}

.corte-item h3{
font-size:24px;
}

/* GRAFICA */

.chart-box{
background:#141414;
padding:18px;
border-radius:20px;
margin-bottom:20px;
border:1px solid rgba(255,255,255,.05);
}

.chart-box h2{
font-size:20px;
margin-bottom:14px;
color:#f7c600;
}

/* INVENTARIO */

.inventory{
background:#141414;
padding:18px;
border-radius:20px;
margin-bottom:20px;
border:1px solid rgba(255,255,255,.05);
}

.inventory h2{
font-size:20px;
margin-bottom:16px;
color:#f7c600;
}

.stock-grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:14px;
}

.stock-card{
background:#1a1a1a;
padding:14px;
border-radius:18px;
border:1px solid rgba(255,255,255,.05);
}

.stock-card img{
width:100%;
height:120px;
object-fit:contain;
background:white;
border-radius:12px;
padding:10px;
margin-bottom:12px;
}

.stock-top{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:10px;
}

.stock-top h3{
font-size:14px;
line-height:1.4;
}

.stock{
padding:6px 10px;
border-radius:40px;
font-size:12px;
font-weight:700;
white-space:nowrap;
}

.green{
background:#003d21;
color:#00ff88;
}

.orange{
background:#4a3300;
color:#ffb300;
}

.red{
background:#460000;
color:#ff4d4d;
}

.stock-actions{
display:flex;
gap:8px;
margin-top:12px;
}

.stock-actions input{
flex:1;
padding:10px;
background:#101010;
border:none;
outline:none;
border-radius:10px;
color:white;
}

.stock-actions button{
padding:10px 14px;
border:none;
border-radius:10px;
background:#f7c600;
font-weight:700;
cursor:pointer;
}

/* TABLA */

.sales{
background:#141414;
padding:18px;
border-radius:20px;
border:1px solid rgba(255,255,255,.05);
}

.sales-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
flex-wrap:wrap;
gap:10px;
}

.sales h2{
font-size:20px;
color:#f7c600;
}

.delete-all{
background:#ff2d2d;
border:none;
padding:12px 18px;
border-radius:12px;
color:white;
font-weight:700;
cursor:pointer;
}

.table{
overflow-x:auto;
}

table{
width:100%;
border-collapse:separate;
border-spacing:0 10px;
min-width:1000px;
}

th{
padding:14px;
font-size:13px;
color:#999;
text-align:left;
font-weight:600;
}

td{
background:#1a1a1a;
padding:14px;
font-size:13px;
vertical-align:top;
}

td:first-child{
border-radius:14px 0 0 14px;
}

td:last-child{
border-radius:0 14px 14px 0;
}

.product{
display:flex;
align-items:center;
gap:10px;
margin-bottom:10px;
background:#101010;
padding:8px;
border-radius:12px;
}

.product img{
width:50px;
height:50px;
object-fit:contain;
background:white;
border-radius:10px;
padding:5px;
}

.badge{
padding:7px 12px;
border-radius:30px;
font-size:12px;
font-weight:700;
display:inline-block;
}

.cash{
background:#003d21;
color:#00ff88;
}

.dollar{
background:#001f4d;
color:#4da6ff;
}

.total{
font-size:16px;
font-weight:800;
color:#f7c600;
}

.fecha{
font-size:12px;
color:#aaa;
line-height:1.5;
}

.vendedor{
display:flex;
align-items:center;
gap:8px;
font-weight:600;
}

.vendedor i{
color:#f7c600;
}

.delete-btn{
background:#ff2d2d;
border:none;
width:40px;
height:40px;
border-radius:12px;
color:white;
cursor:pointer;
}
/* =========================
ALERTAS PROFESIONALES
========================= */

.alert-container{
position:fixed;
top:20px;
right:20px;
display:flex;
flex-direction:column;
gap:14px;
z-index:999999;
width:350px;
max-width:90%;
}

.alert{
position:relative;
overflow:hidden;
display:flex;
align-items:flex-start;
gap:14px;
padding:18px;
border-radius:22px;
backdrop-filter:blur(14px);
background:rgba(20,20,20,.95);
border:1px solid rgba(255,255,255,.06);
box-shadow:
0 10px 30px rgba(0,0,0,.45),
0 0 0 1px rgba(255,255,255,.03) inset;
animation:alertShow .45s ease;
}

.alert::before{
content:'';
position:absolute;
left:0;
top:0;
width:5px;
height:100%;
border-radius:20px;
}

.alert.success::before{
background:#00ff88;
}

.alert.error::before{
background:#ff3b3b;
}

.alert.warning::before{
background:#ffb300;
}

.alert.info::before{
background:#4da6ff;
}

.alert-icon{
width:42px;
height:42px;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
flex-shrink:0;
}

.alert.success .alert-icon{
background:rgba(0,255,136,.12);
color:#00ff88;
}

.alert.error .alert-icon{
background:rgba(255,59,59,.12);
color:#ff4d4d;
}

.alert.warning .alert-icon{
background:rgba(255,179,0,.12);
color:#ffb300;
}

.alert.info .alert-icon{
background:rgba(77,166,255,.12);
color:#4da6ff;
}

.alert-content{
flex:1;
}

.alert-content h4{
font-size:15px;
font-weight:700;
margin-bottom:4px;
color:white;
}

.alert-content p{
font-size:13px;
line-height:1.5;
color:#bdbdbd;
}

.alert-close{
background:none;
border:none;
color:#888;
font-size:16px;
cursor:pointer;
transition:.3s;
}

.alert-close:hover{
color:white;
transform:scale(1.1);
}

.alert-progress{
position:absolute;
bottom:0;
left:0;
height:4px;
width:100%;
animation:progress 3.5s linear forwards;
}

.alert.success .alert-progress{
background:#00ff88;
}

.alert.error .alert-progress{
background:#ff3b3b;
}

.alert.warning .alert-progress{
background:#ffb300;
}

.alert.info .alert-progress{
background:#4da6ff;
}

@keyframes progress{

from{
width:100%;
}

to{
width:0%;
}

}

@keyframes alertShow{

from{
opacity:0;
transform:translateX(120px) scale(.9);
}

to{
opacity:1;
transform:translateX(0) scale(1);
}

}

@keyframes alertHide{

to{
opacity:0;
transform:translateX(120px) scale(.9);
}

}

@media(max-width:700px){

.alert-container{
left:12px;
right:12px;
width:auto;
}

.alert{
padding:16px;
border-radius:18px;
}

}

/* NAV */

.bottom-nav{
position:fixed;
bottom:14px;
left:50%;
transform:translateX(-50%);
width:94%;
max-width:500px;
height:72px;
background:rgba(20,20,20,.95);
backdrop-filter:blur(15px);
border-radius:24px;
display:flex;
justify-content:space-around;
align-items:center;
border:1px solid rgba(255,255,255,.05);
z-index:999;
}

.bottom-btn{
background:none;
border:none;
color:#777;
display:flex;
flex-direction:column;
align-items:center;
gap:5px;
font-size:11px;
cursor:pointer;
transition:.3s;
}

.bottom-btn i{
font-size:20px;
}

.bottom-btn.active{
color:#f7c600;
}

.bottom-btn:hover{
color:#f7c600;
}

/* RESPONSIVE */

@media(max-width:700px){

.logo h1{
font-size:22px;
}

.card h2{
font-size:22px;
}

.chart-box,
.inventory,
.sales,
.corte{
padding:14px;
}

.stock-grid{
grid-template-columns:1fr;
}

table{
min-width:850px;
}

.alert{
min-width:auto;
width:100%;
}

.alert-container{
left:10px;
right:10px;
}

}

</style>
</head>

<body>

<div class="alert-container" id="alertContainer"></div>

<div class="topbar">

<div class="logo">

<i class="fa-solid fa-chart-line"></i>

<h1>Registro de Ventas</h1>

</div>

</div>

<!-- STATS -->

<div class="stats">

<div class="card">
<span>Ventas del día</span>
<h2 id="ventasDia">C$0</h2>
</div>

<div class="card">
<span>Total ventas</span>
<h2 id="totalVentas">0</h2>
</div>

<div class="card">
<span>Productos vendidos</span>
<h2 id="productosVendidos">0</h2>
</div>

<div class="card">
<span>Productos bajos</span>
<h2 id="productosBajos">0</h2>
</div>

</div>

<!-- FILTROS -->

<div class="filters">

<input
type="date"
id="fechaFiltro"
>

<select id="vendedorFiltro">

<option value="">
Todos los vendedores
</option>

<option value="Victor Adan">
Victor Adan
</option>

</select>

<button onclick="filtrarVentas()">

<i class="fa-solid fa-filter"></i>
Filtrar

</button>

</div>

<!-- CORTE DE CAJA -->

<div class="corte">

<h2>
<i class="fa-solid fa-cash-register"></i>
Corte de Caja
</h2>

<div class="corte-box">

<div class="corte-item">
<span>Efectivo Total</span>
<h3 id="corteCaja">C$0</h3>
</div>

<div class="corte-item">
<span>Ventas Mostradas</span>
<h3 id="ventasHoy">0</h3>
</div>

</div>

</div>

<!-- GRAFICA -->

<div class="chart-box">

<h2>

<i class="fa-solid fa-chart-column"></i>

Ventas Generales

</h2>

<canvas id="grafica"></canvas>

</div>

<!-- INVENTARIO -->

<div class="inventory">

<h2>

<i class="fa-solid fa-box"></i>

Inventario

</h2>

<div class="stock-grid"
id="inventarioBox"></div>

</div>

<!-- TABLA -->

<div class="sales">

<div class="sales-top">

<h2>

<i class="fa-solid fa-clock-rotate-left"></i>

Historial de Ventas

</h2>

<button
class="delete-all"
onclick="borrarTodasVentas()"
>

<i class="fa-solid fa-trash"></i>
Borrar Todo

</button>

</div>

<div class="table">

<table>

<thead>

<tr>

<th>Fecha</th>
<th>Vendedor</th>
<th>Productos</th>
<th>Total</th>
<th>Pago</th>
<th>Vuelto</th>
<th>Eliminar</th>

</tr>

</thead>

<tbody id="tablaVentas"></tbody>

</table>

</div>

</div>

<!-- NAV -->

<div class="bottom-nav">

<button class="bottom-btn"
onclick="window.location.href='index.html'">

<i class="fa-solid fa-house"></i>

<span>Inicio</span>

</button>

<button class="bottom-btn"
onclick="window.location.href='carrito.html'">

<i class="fa-solid fa-cart-shopping"></i>

<span>Carrito</span>

</button>

<button class="bottom-btn active">

<i class="fa-solid fa-chart-line"></i>

<span>Ventas</span>

</button>

</div>

<script>
/* =========================
PRODUCTOS
========================= */

const productos = [

{
name:'Mobil Parmazone',
image:'6.jpeg'
},

{
name:'Mobil Heavy Duty',
image:'7.jpeg'
},

{
name:'Mobil ATF D/M',
image:'8.jpeg'
},

{
name:'American Automatic transmission',
image:'11.jpeg'
},


{
name:'Mobil delvac',
image:'12.jpeg'
}

];

/* =========================
INVENTARIO
========================= */

let inventario =
JSON.parse(localStorage.getItem('inventario'));

if(!inventario){

inventario = {

'Mobil Special 20W-50':10,
'Aceite de motor Mobil Special 20W-50':8,
'Mobil Delvac 1300 Super 10W-30':6,
'WD-40':5

};

localStorage.setItem(
'inventario',
JSON.stringify(inventario)
);

}

/* =========================
VENTAS
========================= */

let ventas =
JSON.parse(localStorage.getItem('ventas'))
|| [];

const tabla =
document.getElementById('tablaVentas');

/* =========================
SONIDOS
========================= */

const sonidos = {

success:new Audio(
'https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=correct-2-46134.mp3'
),

error:new Audio(
'https://cdn.pixabay.com/download/audio/2022/03/10/audio_c6ccf26616.mp3?filename=error-126627.mp3'
),

warning:new Audio(
'https://cdn.pixabay.com/download/audio/2022/03/15/audio_5d1b5c5f6f.mp3?filename=warning-notification-2-6838.mp3'
)

};

Object.values(sonidos).forEach(s=>{

s.volume = 0.2;

});

/* =========================
ALERTAS PREMIUM
========================= */

function alerta(
titulo,
mensaje,
tipo='info'
){

const container =
document.getElementById('alertContainer');

let icono =
'fa-circle-info';

if(tipo === 'success'){
icono = 'fa-circle-check';
}

if(tipo === 'error'){
icono = 'fa-circle-xmark';
}

if(tipo === 'warning'){
icono = 'fa-triangle-exclamation';
}

const alert =
document.createElement('div');

alert.className =
`alert ${tipo}`;

alert.innerHTML = `

<div class="alert-icon">

<i class="fa-solid ${icono}"></i>

</div>

<div class="alert-content">

<h4>${titulo}</h4>

<p>${mensaje}</p>

</div>

<button class="alert-close">

<i class="fa-solid fa-xmark"></i>

</button>

<div class="alert-progress"></div>

`;

container.appendChild(alert);

/* SONIDO */

if(sonidos[tipo]){

sonidos[tipo]
.currentTime = 0;

sonidos[tipo]
.play()
.catch(()=>{});

}

/* REMOVER */

const removeAlert = ()=>{

alert.style.animation =
'alertHide .35s ease forwards';

setTimeout(()=>{

alert.remove();

},300);

};

alert.querySelector('.alert-close')
.onclick = removeAlert;

setTimeout(removeAlert,3500);

}

/* =========================
INVENTARIO
========================= */

function renderInventario(){

const box =
document.getElementById('inventarioBox');

box.innerHTML = '';

let bajos = 0;

productos.forEach(p=>{

const stock =
inventario[p.name] || 0;

let clase = 'green';

if(stock <= 5){
clase = 'orange';
}

if(stock <= 2){
clase = 'red';
bajos++;
}

box.innerHTML += `

<div class="stock-card">

<img src="${p.image}">

<div class="stock-top">

<h3>${p.name}</h3>

<div class="stock ${clase}">
${stock} unidades
</div>

</div>

<div class="stock-actions">

<input
type="number"
min="1"
id="stock-${p.name}"
placeholder="Cantidad"
>

<button onclick="agregarStock('${p.name}')">

<i class="fa-solid fa-plus"></i>

</button>

</div>

</div>

`;

});

document.getElementById('productosBajos')
.innerText = bajos;

}

/* =========================
AGREGAR STOCK
========================= */

function agregarStock(nombre){

const input =
document.getElementById(
`stock-${nombre}`
);

const cantidad =
Number(input.value);

if(cantidad <= 0){

alerta(
'Cantidad inválida',
'Ingresa una cantidad válida',
'error'
);

return;

}

inventario[nombre] =
(inventario[nombre] || 0)
+ cantidad;

localStorage.setItem(
'inventario',
JSON.stringify(inventario)
);

input.value = '';

renderInventario();

alerta(
'Inventario actualizado',
`Se agregaron ${cantidad} unidades`,
'success'
);

}

/* =========================
RENDER VENTAS
========================= */

function renderVentas(lista = ventas){

tabla.innerHTML = '';

let totalDia = 0;
let vendidos = 0;

const copia = [...lista].reverse();

if(copia.length === 0){

tabla.innerHTML = `

<tr>

<td colspan="7"
style="
text-align:center;
padding:35px;
border-radius:18px;
background:#1a1a1a;
color:#999;
">

<i class="fa-solid fa-box-open"
style="
font-size:38px;
margin-bottom:10px;
display:block;
color:#444;
"></i>

No hay ventas registradas

</td>

</tr>

`;

}

copia.forEach((v)=>{

const productosHTML =
v.productos.map(p=>`

<div class="product">

<img src="${p.images[0]}">

<div>

<b>${p.name}</b>

</div>

</div>

`).join('');

tabla.innerHTML += `

<tr>

<td>

<div class="fecha">
${v.fecha}
</div>

</td>

<td>

<div class="vendedor">

<i class="fa-solid fa-user"></i>

${v.vendedor}

</div>

</td>

<td>

${productosHTML}

</td>

<td>

<div class="total">

${v.total}

</div>

</td>

<td>

<div class="badge
${v.moneda === 'dolar'
? 'dollar'
: 'cash'}">

${v.moneda}

</div>

</td>

<td>

${v.vuelto}

</td>

<td>

<button
class="delete-btn"
onclick="eliminarVenta(${ventas.indexOf(v)})"
>

<i class="fa-solid fa-trash"></i>

</button>

</td>

</tr>

`;

const numero =
Number(
v.total.replace('C$','')
);

totalDia += numero;

vendidos +=
v.productos.length;

});

document.getElementById('ventasDia')
.innerText =
'C$' + totalDia.toFixed(2);

document.getElementById('corteCaja')
.innerText =
'C$' + totalDia.toFixed(2);

document.getElementById('ventasHoy')
.innerText =
lista.length;

document.getElementById('totalVentas')
.innerText =
ventas.length;

document.getElementById('productosVendidos')
.innerText =
vendidos;

crearGrafica(lista);

}

/* =========================
FILTRAR
========================= */

function filtrarVentas(){

const fecha =
document.getElementById('fechaFiltro')
.value;

const vendedor =
document.getElementById('vendedorFiltro')
.value;

const filtradas =
ventas.filter(v=>{

let coincideFecha = true;
let coincideVendedor = true;

if(fecha !== ''){

const fechaVenta =
new Date(v.fecha);

const año =
fechaVenta.getFullYear();

const mes =
String(
fechaVenta.getMonth()+1
).padStart(2,'0');

const dia =
String(
fechaVenta.getDate()
).padStart(2,'0');

const fechaFormateada =
`${año}-${mes}-${dia}`;

coincideFecha =
fechaFormateada === fecha;

}

if(vendedor !== ''){

coincideVendedor =
v.vendedor === vendedor;

}

return coincideFecha &&
coincideVendedor;

});

renderVentas(filtradas);

alerta(
'Filtro aplicado',
`${filtradas.length} ventas encontradas`,
'info'
);

}

/* =========================
ELIMINAR VENTA
========================= */

function eliminarVenta(index){

const confirmar =
confirm(
'¿Eliminar esta venta?'
);

if(!confirmar){
return;
}

ventas.splice(index,1);

localStorage.setItem(
'ventas',
JSON.stringify(ventas)
);

renderVentas();

alerta(
'Venta eliminada',
'La venta fue eliminada',
'warning'
);

}

/* =========================
BORRAR TODO
========================= */

function borrarTodasVentas(){

const confirmar =
confirm(
'¿Borrar TODAS las ventas?'
);

if(!confirmar){
return;
}

localStorage.removeItem('ventas');

ventas = [];

renderVentas();

alerta(
'Historial eliminado',
'Todas las ventas fueron eliminadas',
'error'
);

}

/* =========================
GRAFICA
========================= */

let grafica;

function crearGrafica(lista){

const dias = [];
const totales = [];

lista.forEach(v=>{

dias.push(
v.fecha.split(',')[0]
);

totales.push(
Number(
v.total.replace('C$','')
)
);

});

if(grafica){
grafica.destroy();
}

grafica =
new Chart(
document.getElementById('grafica'),
{

type:'bar',

data:{

labels:dias,

datasets:[{

label:'Ventas',

data:totales,

backgroundColor:'#f7c600',

hoverBackgroundColor:'#ffd93d',

borderRadius:14,

borderSkipped:false

}]

},

options:{

responsive:true,

plugins:{

legend:{
display:false
}

},

animation:{
duration:1200
},

scales:{

y:{

ticks:{
color:'#999'
},

grid:{
color:'rgba(255,255,255,.05)'
}

},

x:{

ticks:{
color:'#999'
},

grid:{
display:false
}

}

}

}

}

);

}

/* =========================
INICIAR
========================= */

renderVentas();
renderInventario();

alerta(
'Sistema iniciado',
'Registro de ventas cargado correctamente',
'success'
);


</script>

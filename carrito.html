<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Carrito - LUBRI EXPRES</title>
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

</head>

<body>

<div class="alert-container"
id="alertContainer"></div>

<!-- HEADER -->

<div class="header">

<div class="logo">

<div class="logo-box">

<i class="fa-solid fa-oil-can"></i>

</div>

<div>

<h1>LUBRI EXPRES</h1>

<p>
Sistema de ventas profesional
</p>

</div>

</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- PRODUCTOS -->

<div>

<div class="products"
id="carrito"></div>

<div id="vacio"></div>

</div>

<!-- PANEL -->

<div class="panel">

<h2>

<i class="fa-solid fa-cash-register"></i>

Caja

</h2>

<div class="resume">

<div class="row">

<span>Productos</span>

<strong id="cantidad">
0
</strong>

</div>

<div class="row">

<span>Total a pagar</span>

<div class="total"
id="total">

C$0.00

</div>

</div>

</div>

<label>
Vendedor
</label>

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="vendedor"
value="Victor Adan"
>

</div>

<label>
Tipo de moneda
</label>

<select
id="moneda"
onchange="calcularVuelto()"
>

<option value="cordoba">
Pago en Córdoba
</option>

<option value="dolar">
Pago en Dólares
</option>

</select>

<label>
Dinero recibido
</label>

<div class="input-box">

<i class="fa-solid fa-money-bill-wave"></i>

<input
type="number"
id="recibido"
placeholder="0.00"
oninput="calcularVuelto()"
>

</div>

<div class="conversion"
id="conversion"></div>

<div class="change">

<span>Vuelto</span>

<strong id="vuelto">
C$0.00
</strong>

</div>

<button
class="btn"
onclick="finalizarVenta()"
>

<i class="fa-solid fa-check"></i>

Finalizar Venta

</button>

</div>

</div>

<!-- NAV -->

<div class="bottom-nav">

<button class="bottom-btn"
onclick="window.location.href='index.html'">

<i class="fa-solid fa-house"></i>

<span>Inicio</span>

</button>

<button class="bottom-btn active">

<i class="fa-solid fa-cart-shopping"></i>

<span>Carrito</span>

<div class="badge"
id="cart-count">
0
</div>

</button>

<button class="bottom-btn"
onclick="window.location.href='registro.html'">

<i class="fa-solid fa-chart-line"></i>

<span>Ventas</span>

</button>

</div>

<script src="funcioness.js">

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Carrito - LUBRI EXPRES</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:
linear-gradient(to bottom,#0b0b0b,#111);
color:white;
overflow-x:hidden;
padding:18px;
padding-bottom:120px;
}

/* HEADER */

.header{
max-width:1300px;
margin:auto;
margin-bottom:25px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.logo-box{
width:55px;
height:55px;
border-radius:18px;
background:#f7c600;
display:flex;
justify-content:center;
align-items:center;
color:black;
font-size:24px;
box-shadow:
0 0 25px rgba(247,198,0,.35);
}

.logo h1{
font-size:30px;
font-weight:800;
color:#f7c600;
}

.logo p{
font-size:13px;
color:#999;
margin-top:2px;
}

/* MAIN */

.main{
max-width:1300px;
margin:auto;
display:grid;
grid-template-columns:1.4fr .8fr;
gap:22px;
align-items:start;
}

/* PRODUCTOS */

.products{
display:grid;
gap:16px;
}

.card{
background:
linear-gradient(
145deg,
#171717,
#111
);
border-radius:26px;
padding:16px;
display:flex;
gap:15px;
align-items:center;
border:1px solid rgba(255,255,255,.05);
transition:.35s;
position:relative;
overflow:hidden;
}

.card::before{
content:'';
position:absolute;
top:-50%;
right:-50%;
width:200px;
height:200px;
background:
radial-gradient(
rgba(247,198,0,.10),
transparent
);
}

.card:hover{
transform:translateY(-4px);
box-shadow:
0 15px 35px rgba(0,0,0,.45),
0 0 30px rgba(247,198,0,.10);
}

.card img{
width:110px;
height:110px;
background:white;
border-radius:20px;
padding:10px;
object-fit:contain;
}

.info{
flex:1;
}

.info h3{
font-size:20px;
margin-bottom:6px;
}

.info p{
font-size:13px;
color:#999;
line-height:1.6;
margin-bottom:12px;
}

.price{
display:inline-flex;
align-items:center;
gap:6px;
padding:10px 16px;
border-radius:14px;
background:#f7c60015;
color:#f7c600;
font-size:22px;
font-weight:800;
}

.delete{
width:50px;
height:50px;
border:none;
border-radius:16px;
background:#ff3838;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

.delete:hover{
transform:scale(1.08);
background:#ff1f1f;
}

/* PANEL */

.panel{
background:
linear-gradient(
145deg,
#171717,
#111
);
border-radius:30px;
padding:24px;
border:1px solid rgba(255,255,255,.05);
position:sticky;
top:15px;
overflow:hidden;
}

.panel::before{
content:'';
position:absolute;
top:-80px;
right:-80px;
width:250px;
height:250px;
background:
radial-gradient(
rgba(247,198,0,.08),
transparent
);
}

.panel h2{
font-size:26px;
margin-bottom:20px;
color:#f7c600;
display:flex;
align-items:center;
gap:10px;
}

/* RESUMEN */

.resume{
background:#0f0f0f;
padding:20px;
border-radius:22px;
margin-bottom:20px;
border:1px solid rgba(255,255,255,.04);
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:14px;
font-size:15px;
color:#aaa;
}

.row:last-child{
margin-bottom:0;
}

.total{
font-size:36px;
font-weight:800;
color:#f7c600;
}

/* INPUTS */

label{
display:block;
margin-bottom:8px;
margin-top:15px;
font-size:13px;
color:#aaa;
font-weight:600;
}

.input-box{
position:relative;
}

.input-box i{
position:absolute;
left:16px;
top:50%;
transform:translateY(-50%);
color:#888;
}

input,
select{
width:100%;
padding:16px 16px 16px 48px;
border:none;
outline:none;
border-radius:16px;
background:#1d1d1d;
color:white;
font-size:15px;
transition:.3s;
}

select{
padding-left:18px;
}

input:focus,
select:focus{
outline:2px solid #f7c600;
background:#232323;
}

/* CONVERSION */

.conversion{
margin-top:12px;
padding:14px;
border-radius:16px;
background:#0f0f0f;
font-size:14px;
color:#00ff88;
display:none;
font-weight:600;
border:1px solid rgba(0,255,136,.15);
}

/* VUELTO */

.change{
margin-top:18px;
padding:20px;
border-radius:22px;
background:
linear-gradient(
145deg,
#0f0f0f,
#141414
);
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid rgba(255,255,255,.04);
}

.change span{
font-size:16px;
color:#aaa;
font-weight:600;
}

.change strong{
font-size:34px;
color:#00ff88;
}

/* BOTON */

.btn{
width:100%;
padding:18px;
margin-top:22px;
border:none;
border-radius:18px;
background:#f7c600;
font-size:17px;
font-weight:800;
cursor:pointer;
transition:.35s;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
}

.btn:hover{
transform:translateY(-3px);
background:white;
box-shadow:
0 10px 25px rgba(247,198,0,.25);
}

/* EMPTY */

.empty{
background:#151515;
border-radius:28px;
padding:60px 25px;
text-align:center;
border:1px dashed rgba(255,255,255,.08);
}

.empty i{
font-size:90px;
color:#f7c600;
margin-bottom:18px;
}

.empty h2{
font-size:30px;
margin-bottom:10px;
}

.empty p{
color:#888;
font-size:15px;
}

/* ALERTAS */

.alert-container{
position:fixed;
top:20px;
right:20px;
display:flex;
flex-direction:column;
gap:14px;
z-index:999999;
}

.alert{
min-width:330px;
background:#151515;
padding:16px;
border-radius:20px;
display:flex;
align-items:center;
gap:14px;
box-shadow:
0 15px 35px rgba(0,0,0,.45);
animation:show .4s ease;
position:relative;
overflow:hidden;
border:1px solid rgba(255,255,255,.05);
}

.alert::before{
content:'';
position:absolute;
left:0;
top:0;
width:5px;
height:100%;
}

.alert.success::before{
background:#00ff88;
}

.alert.error::before{
background:#ff3b3b;
}

.alert.warning::before{
background:#ffb300;
}

.alert i{
font-size:22px;
}

.alert.success i{
color:#00ff88;
}

.alert.error i{
color:#ff3b3b;
}

.alert.warning i{
color:#ffb300;
}

.alert h4{
font-size:14px;
margin-bottom:3px;
}

.alert p{
font-size:12px;
color:#999;
}

@keyframes show{

from{
opacity:0;
transform:translateX(100px);
}

to{
opacity:1;
transform:translateX(0);
}

}

/* NAV */

.bottom-nav{
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:520px;
height:78px;
background:rgba(20,20,20,.95);
backdrop-filter:blur(18px);
border-radius:28px;
display:flex;
justify-content:space-around;
align-items:center;
border:1px solid rgba(255,255,255,.05);
z-index:999999;
box-shadow:
0 10px 30px rgba(0,0,0,.4);
}

.bottom-btn{
background:none;
border:none;
display:flex;
flex-direction:column;
align-items:center;
gap:5px;
color:#777;
font-size:11px;
font-weight:600;
cursor:pointer;
transition:.3s;
position:relative;
}

.bottom-btn i{
font-size:22px;
}

.bottom-btn.active,
.bottom-btn:hover{
color:#f7c600;
}

.badge{
position:absolute;
top:-5px;
right:-8px;
background:red;
min-width:20px;
height:20px;
padding:0 5px;
border-radius:50px;
display:flex;
justify-content:center;
align-items:center;
font-size:10px;
font-weight:bold;
}

/* RESPONSIVE */

@media(max-width:950px){

.main{
grid-template-columns:1fr;
}

.panel{
position:relative;
top:0;
}

}

@media(max-width:700px){

body{
padding:12px;
padding-bottom:120px;
}

.logo h1{
font-size:24px;
}

.card{
flex-direction:column;
text-align:center;
}

.card img{
width:150px;
height:150px;
}

.delete{
width:100%;
height:48px;
}

.total{
font-size:28px;
}

.change strong{
font-size:26px;
}

.alert{
min-width:auto;
width:100%;
}

.alert-container{
left:10px;
right:10px;
}

}

</style>
</head>

<body>

<div class="alert-container"
id="alertContainer"></div>

<!-- HEADER -->

<div class="header">

<div class="logo">

<div class="logo-box">

<i class="fa-solid fa-oil-can"></i>

</div>

<div>

<h1>LUBRI EXPRES</h1>

<p>
Sistema de ventas profesional
</p>

</div>

</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- PRODUCTOS -->

<div>

<div class="products"
id="carrito"></div>

<div id="vacio"></div>

</div>

<!-- PANEL -->

<div class="panel">

<h2>

<i class="fa-solid fa-cash-register"></i>

Caja

</h2>

<div class="resume">

<div class="row">

<span>Productos</span>

<strong id="cantidad">
0
</strong>

</div>

<div class="row">

<span>Total a pagar</span>

<div class="total"
id="total">

C$0.00

</div>

</div>

</div>

<label>
Vendedor
</label>

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="vendedor"
value="Victor Adan"
>

</div>

<label>
Tipo de moneda
</label>

<select
id="moneda"
onchange="calcularVuelto()"
>

<option value="cordoba">
Pago en Córdoba
</option>

<option value="dolar">
Pago en Dólares
</option>

</select>

<label>
Dinero recibido
</label>

<div class="input-box">

<i class="fa-solid fa-money-bill-wave"></i>

<input
type="number"
id="recibido"
placeholder="0.00"
oninput="calcularVuelto()"
>

</div>

<div class="conversion"
id="conversion"></div>

<div class="change">

<span>Vuelto</span>

<strong id="vuelto">
C$0.00
</strong>

</div>

<button
class="btn"
onclick="finalizarVenta()"
>

<i class="fa-solid fa-check"></i>

Finalizar Venta

</button>

</div>

</div>

<!-- NAV -->

<div class="bottom-nav">

<button class="bottom-btn"
onclick="window.location.href='index.html'">

<i class="fa-solid fa-house"></i>

<span>Inicio</span>

</button>

<button class="bottom-btn active">

<i class="fa-solid fa-cart-shopping"></i>

<span>Carrito</span>

<div class="badge"
id="cart-count">
0
</div>

</button>

<button class="bottom-btn"
onclick="window.location.href='registro.html'">

<i class="fa-solid fa-chart-line"></i>

<span>Ventas</span>

</button>

</div>

<script>

/* CONFIG */

const cambioDolar = 36.50;

/* STORAGE */

let carrito =
JSON.parse(
localStorage.getItem('carrito')
) || [];

const container =
document.getElementById('carrito');

const vacio =
document.getElementById('vacio');

const totalBox =
document.getElementById('total');

/* ALERTAS */

function alerta(
tipo,
titulo,
mensaje,
icono
){

const box =
document.getElementById(
'alertContainer'
);

const alert =
document.createElement('div');

alert.className =
`alert ${tipo}`;

alert.innerHTML = `

<i class="fa-solid ${icono}"></i>

<div>

<h4>${titulo}</h4>

<p>${mensaje}</p>

</div>

`;

box.appendChild(alert);

setTimeout(()=>{

alert.style.opacity='0';

alert.style.transform=
'translateX(120px)';

setTimeout(()=>{

alert.remove();

},300);

},3200);

}

/* RENDER */

function render(){

container.innerHTML='';

if(carrito.length === 0){

vacio.innerHTML = `

<div class="empty">

<i class="fa-solid fa-cart-shopping"></i>

<h2>
Carrito vacío
</h2>

<p>
Agrega productos para comenzar una venta
</p>

</div>

`;

document.getElementById('cantidad')
.innerText='0';

totalBox.innerText='C$0.00';

return;

}

vacio.innerHTML='';

let total = 0;

carrito.forEach((p,i)=>{

total += p.price;

container.innerHTML += `

<div class="card">

<img src="${p.images[0]}">

<div class="info">

<h3>${p.name}</h3>

<p>${p.description}</p>

<div class="price">

C$${p.price.toFixed(2)}

</div>

</div>

<button
class="delete"
onclick="eliminar(${i})"
>

<i class="fa-solid fa-trash"></i>

</button>

</div>

`;

});

document.getElementById('cantidad')
.innerText =
carrito.length;

document.getElementById('cart-count')
.innerText =
carrito.length;

totalBox.innerText =
'C$' + total.toFixed(2);

calcularVuelto();

}

/* ELIMINAR */

function eliminar(i){

const producto =
carrito[i];

carrito.splice(i,1);

localStorage.setItem(
'carrito',
JSON.stringify(carrito)
);

render();

alerta(
'warning',
'Producto eliminado',
producto.name + ' eliminado',
'fa-trash'
);

}

/* VUELTO */

function calcularVuelto(){

const recibido =
Number(
document.getElementById(
'recibido'
).value
);

const moneda =
document.getElementById(
'moneda'
).value;

const total =
carrito.reduce(
(a,b)=>a+b.price,
0
);

let vuelto = 0;

const conversion =
document.getElementById(
'conversion'
);

if(moneda === 'dolar'){

const convertido =
recibido * cambioDolar;

vuelto =
convertido - total;

conversion.style.display =
'block';

conversion.innerHTML = `

US$${recibido.toFixed(2)}
=
C$${convertido.toFixed(2)}

`;

}else{

vuelto =
recibido - total;

conversion.style.display =
'none';

}

document.getElementById('vuelto')
.innerText =
'C$' +
(vuelto > 0
? vuelto.toFixed(2)
: '0.00');

if(vuelto < 0){

document.getElementById('vuelto')
.style.color='#ff4d4d';

}else{

document.getElementById('vuelto')
.style.color='#00ff88';

}

}

/* FINALIZAR */

function finalizarVenta(){

if(carrito.length === 0){

alerta(
'error',
'Carrito vacío',
'Agrega productos antes de vender',
'fa-cart-shopping'
);

return;

}

const vendedor =
document.getElementById(
'vendedor'
).value;

const recibido =
Number(
document.getElementById(
'recibido'
).value
);

const moneda =
document.getElementById(
'moneda'
).value;

const total =
carrito.reduce(
(a,b)=>a+b.price,
0
);

let recibidoFinal =
moneda === 'dolar'
? recibido * cambioDolar
: recibido;

if(recibidoFinal < total){

alerta(
'error',
'Dinero insuficiente',
'El monto recibido no cubre la venta',
'fa-money-bill'
);

return;

}

const vuelto =
recibidoFinal - total;

/* INVENTARIO */

let inventario =
JSON.parse(
localStorage.getItem(
'inventario'
)
) || {};

carrito.forEach(producto=>{

if(
inventario[producto.name]
!= null
){

inventario[producto.name]--;

}

});

localStorage.setItem(
'inventario',
JSON.stringify(inventario)
);

/* VENTAS */

let ventas =
JSON.parse(
localStorage.getItem(
'ventas'
)
) || [];

ventas.push({

fecha:
new Date()
.toLocaleString(),

vendedor,

productos:carrito,

moneda,

total:
'C$' + total.toFixed(2),

recibido:
moneda === 'dolar'
? '$' + recibido.toFixed(2)
: 'C$' + recibido.toFixed(2),

vuelto:
'C$' + vuelto.toFixed(2)

});

localStorage.setItem(
'ventas',
JSON.stringify(ventas)
);

/* LIMPIAR */

localStorage.removeItem('carrito');

alerta(
'success',
'Venta realizada',
'La venta fue registrada',
'fa-circle-check'
);

setTimeout(()=>{

window.location.href =
'registro.html';

},1600);

}

/* START */

render();

</script>

</body>
</html>

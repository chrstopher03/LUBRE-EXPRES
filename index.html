<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUBRI EXPRES</title>

<link rel="icon" href="logo.jpeg">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#f7c600">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<!-- ICONOS -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<!-- FUENTE -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

</head>

<body>
<!-- LOADER PREMIUM -->
<div id="loaderScreen">

    <div class="loader-glow"></div>

    <div class="loader-content">

        <div class="loader-logo">
            <img src="logo.jpeg" alt="LUBRI EXPRES">
        </div>

        <h1>LUBRI EXPRES</h1>

        <p class="loader-subtitle">
            Potencia y protección para tu motor
        </p>

        <div class="loader-bar-container">
            <div id="loaderBar" class="loader-bar"></div>
        </div>

        <p id="loaderText" class="loader-text">
            Cargando catálogo...
        </p>

    </div>

</div>
<header class="header">

<div class="logo-container">

<img src="logo.jpeg" alt="LUBRI EXPRES">

<h2>LUBRI EXPRES</h2>

</div>

</header>


<section class="hero">

<h1>
LOS MEJORES <span>LUBRICANTES</span>
</h1>

<p>
Aceites y lubricantes para todo tipo de vehículos.
</p>

<button onclick="document.getElementById('productos').scrollIntoView({behavior:'smooth'})">
COMPRAR AHORA
</button>

<button id="installBtn" onclick="instalarApp()">
<i class="fa-solid fa-download"></i>
INSTALAR APP
</button>

</section>

<section class="filtros">

<div class="search-box">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
id="buscador"
placeholder="Buscar productos..."
>

</div>

<select id="categoria">

<option value="todos">
Todas las categorías
</option>

<option value="motor">
Aceite Motor
</option>

<option value="grasa">
Grasas
</option>

<option value="hidraulico">
Hidráulico
</option>

</select>

</section>
<div id="toast-container"></div>
<section class="productos" id="productos"></section>

<div class="modal" id="modal">

<div class="modal-content">

<div class="modal-img-box">

<img id="modal-img">

<div class="modal-arrows">

<button onclick="anteriorImagen()">
<i class="fa-solid fa-chevron-left"></i>
</button>

<button onclick="siguienteImagen()">
<i class="fa-solid fa-chevron-right"></i>
</button>

</div>

</div>
<div id="modal-stock"></div>
<div class="modal-info">

<h2 id="modal-title"></h2>

<p id="modal-desc"></p>

<div class="modal-price" id="modal-price"></div>

<div class="modal-buttons">

<button class="close"
onclick="cerrarModal()">
Cerrar
</button>

<button class="cart"
onclick="agregarCarrito()">
Agregar al carrito
</button>

</div>

</div>

</div>

</div>

<footer>

<h2>LUBRI EXPRES</h2>

<p>
Los mejores lubricantes para vehículos.
</p>

<p>
© 2026 Todos los derechos reservados
</p>

</footer>

<div class="bottom-nav">

<button class="bottom-btn active">

<i class="fa-solid fa-house"></i>

<span>Inicio</span>

</button>

<button class="bottom-btn"
onclick="window.location.href='carrito.html'">

<i class="fa-solid fa-cart-shopping"></i>

<span>Carrito</span>

<div class="cart-badge"
id="cart-count">
0
</div>

</button>


<button class="bottom-btn"
onclick="window.location.href='registro.html'">

<i class="fa-solid fa-chart-line"></i>

<span>Ventas</span>

</button>

</div>

<script src="funcion.js"></script>

</body>
</html>
